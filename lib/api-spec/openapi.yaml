openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: onboarding
    description: Company onboarding operations
  - name: auth
    description: Authentication and password recovery operations
  - name: knowledge
    description: Company knowledge file operations
  - name: platform-admin
    description: Platform-owner analytics operations
  - name: activity
    description: Organization activity and usage tracking

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /onboarding/companies:
    post:
      operationId: createCompanyOnboarding
      tags: [onboarding]
      summary: Create a company workspace
      description: Creates a pending organization and its initial admin user for security review.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCompanyOnboardingRequest"
      responses:
        "201":
          description: Company workspace created and submitted for security review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyOnboardingResponse"
        "409":
          description: Company domain already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /onboarding/document-upload-url:
    post:
      operationId: requestOnboardingDocumentUploadUrl
      tags: [onboarding]
      summary: Request a private onboarding document upload URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardingDocumentUploadRequest"
      responses:
        "200":
          description: Private upload URL generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingDocumentUploadResponse"
        "422":
          description: Invalid file metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResult"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Account inactive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /auth/session:
    get:
      operationId: getSession
      tags: [auth]
      summary: Get the current authenticated session
      responses:
        "200":
          description: Session state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          description: No active session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Revoke the current session
      responses:
        "200":
          description: Session revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"

  /auth/password-reset/request:
    post:
      operationId: requestPasswordReset
      tags: [auth]
      summary: Request a password reset verification code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequest"
      responses:
        "200":
          description: Generic password reset acceptance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordResetRequestResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /auth/password-reset/verify:
    post:
      operationId: verifyPasswordReset
      tags: [auth]
      summary: Verify a password reset code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetVerifyRequest"
      responses:
        "200":
          description: Reset authorization issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordResetVerifyResponse"
        "400":
          description: Invalid or expired code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /auth/password-reset/complete:
    post:
      operationId: completePasswordReset
      tags: [auth]
      summary: Complete a password reset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetCompleteRequest"
      responses:
        "200":
          description: Password reset completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordResetCompleteResponse"
        "400":
          description: Invalid or expired reset token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: Invalid onboarding request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /knowledge/files/upload-url:
    post:
      operationId: requestKnowledgeFileUploadUrl
      tags: [knowledge]
      summary: Request a private knowledge file upload URL
      parameters:
        - $ref: "#/components/parameters/FinOSOrganizationId"
        - $ref: "#/components/parameters/FinOSUserEmail"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeFileUploadInput"
      responses:
        "200":
          description: Private upload URL generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeFileUploadUrlResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing workspace identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Upload access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /knowledge/files:
    get:
      operationId: listKnowledgeFiles
      tags: [knowledge]
      summary: List company knowledge files
      parameters:
        - $ref: "#/components/parameters/FinOSOrganizationId"
        - $ref: "#/components/parameters/FinOSUserEmail"
      responses:
        "200":
          description: Organization-scoped knowledge files
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeFileListResponse"
        "401":
          description: Missing workspace identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Knowledge access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /knowledge/files/finalize:
    post:
      operationId: finalizeKnowledgeFile
      tags: [knowledge]
      summary: Save uploaded knowledge file metadata
      parameters:
        - $ref: "#/components/parameters/FinOSOrganizationId"
        - $ref: "#/components/parameters/FinOSUserEmail"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeFileFinalizeInput"
      responses:
        "201":
          description: Knowledge file metadata saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeFile"
        "400":
          description: Invalid request or missing object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing workspace identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Upload access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /knowledge/files/{fileId}/download-url:
    get:
      operationId: getKnowledgeFileDownloadUrl
      tags: [knowledge]
      summary: Get a private knowledge file download URL
      parameters:
        - $ref: "#/components/parameters/FinOSOrganizationId"
        - $ref: "#/components/parameters/FinOSUserEmail"
        - name: fileId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Private download URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeFileDownloadUrlResponse"
        "401":
          description: Missing workspace identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: File access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: File not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /knowledge/files/{fileId}:
    delete:
      operationId: deleteKnowledgeFile
      tags: [knowledge]
      summary: Delete a company knowledge file
      parameters:
        - $ref: "#/components/parameters/FinOSOrganizationId"
        - $ref: "#/components/parameters/FinOSUserEmail"
        - name: fileId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Knowledge file deleted
        "401":
          description: Missing workspace identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: File deletion denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: File not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /platform-admin/analytics:
    get:
      operationId: getPlatformAnalytics
      tags: [platform-admin]
      summary: Get platform owner analytics
      description: Returns cross-company analytics for an authorized platform owner.
      parameters:
        - $ref: "#/components/parameters/FinOSPlatformAdminEmail"
      responses:
        "200":
          description: Platform analytics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformAnalytics"
        "401":
          description: Missing platform admin identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /platform-admin/account-applications:
    get:
      operationId: listAccountApplications
      tags: [platform-admin]
      summary: List account applications for review
      parameters:
        - $ref: "#/components/parameters/FinOSPlatformAdminEmail"
      responses:
        "200":
          description: Account applications
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountApplicationList"
        "401":
          description: Missing platform admin identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Platform admin access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /platform-admin/account-applications/{applicationId}/decision:
    post:
      operationId: decideAccountApplication
      tags: [platform-admin]
      summary: Approve or reject an account application
      parameters:
        - $ref: "#/components/parameters/FinOSPlatformAdminEmail"
        - name: applicationId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountApplicationDecisionRequest"
      responses:
        "200":
          description: Application decision applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountApplication"
        "400":
          description: Invalid decision or application state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing platform admin identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Platform admin access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Application not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Platform analytics unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /activity/events:
    post:
      operationId: recordActivityEvent
      tags: [activity]
      summary: Record a workspace activity event
      description: Records an organization-scoped activity event and optional usage metric.
      parameters:
        - $ref: "#/components/parameters/FinOSOrganizationId"
        - $ref: "#/components/parameters/FinOSUserEmail"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordActivityEventRequest"
      responses:
        "204":
          description: Activity event recorded
        "400":
          description: Invalid activity event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing workspace identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Workspace access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

components:
  parameters:
    FinOSOrganizationId:
      name: x-finos-organization-id
      in: header
      required: true
      schema:
        type: string
        minLength: 1

    FinOSUserEmail:
      name: x-finos-user-email
      in: header
      required: true
      schema:
        type: string

    FinOSPlatformAdminEmail:
      name: x-finos-platform-admin-email
      in: header
      required: true
      schema:
        type: string
        minLength: 1

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    CreateCompanyOnboardingRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          description: Company name

        email:
          type: string
          format: email
          description: Work email address

        full_name:
          type: string
          minLength: 2
          description: Applicant full legal name

        phone:
          type: string
          minLength: 1
          description: Registered applicant phone number

        idNumber:
          type: string
          minLength: 14
          description: Applicant national ID number

        documentReference:
          type: string
          minLength: 1
          description: Private App Storage object path for the uploaded document

        documentType:
          type: string
          minLength: 1
          description: Uploaded document MIME type

        password:
          type: string
          minLength: 8
          description: Account password. The server stores only a secure password hash.

        industry:
          type: string
          minLength: 1
          description: Company industry

        company_size:
          type: string
          minLength: 1
          description: Company size

        subscription:
          type: string
          enum:
            - basic
            - premium
          description: Requested subscription plan

      required:
        - name
        - full_name
        - email
        - phone
        - idNumber
        - documentReference
        - documentType
        - password
        - industry
        - company_size
        - subscription

    OnboardingDocumentUploadRequest:
      type: object
      properties:
        original_file_name:
          type: string
          minLength: 1
        mime_type:
          type: string
          minLength: 1
        size_bytes:
          type: number
          minimum: 1
      required:
        - original_file_name
        - mime_type
        - size_bytes

    OnboardingDocumentUploadResponse:
      type: object
      properties:
        upload_url:
          type: string
        storage_key:
          type: string
      required:
        - upload_url
        - storage_key

    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
      required: [email, password]

    AuthenticatedUser:
      type: object
      properties:
        id: { type: string }
        organization_id: { type: string }
        email: { type: string, format: email }
        name: { type: string }
        role: { type: string }
        status: { type: string }
      required: [id, organization_id, email, name, role, status]

    LoginResult:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/AuthenticatedUser"
        expires_at:
          type: string
          format: date-time
      required: [user, expires_at]

    SessionResponse:
      type: object
      properties:
        authenticated: { type: boolean }
        user:
          anyOf:
            - $ref: "#/components/schemas/AuthenticatedUser"
            - type: "null"
      required: [authenticated]

    PasswordResetRequest:
      type: object
      properties:
        email: { type: string, format: email }
        phone: { type: string, minLength: 1 }
        idNumber: { type: string, minLength: 14 }
      required: [email, phone, idNumber]

    PasswordResetRequestResponse:
      type: object
      properties:
        accepted: { type: boolean }
        message: { type: string }
        test_otp:
          type: [string, "null"]
      required: [accepted, message]

    PasswordResetVerifyRequest:
      type: object
      properties:
        email: { type: string, format: email }
        otp: { type: string, minLength: 6, maxLength: 6 }
      required: [email, otp]

    PasswordResetVerifyResponse:
      type: object
      properties:
        verified: { type: boolean }
        reset_token: { type: string }
        expires_at: { type: string, format: date-time }
      required: [verified, reset_token, expires_at]

    PasswordResetCompleteRequest:
      type: object
      properties:
        email: { type: string, format: email }
        resetToken: { type: string, minLength: 1 }
        newPassword: { type: string, minLength: 8 }
      required: [email, resetToken, newPassword]

    PasswordResetCompleteResponse:
      type: object
      properties:
        reset: { type: boolean }
        message: { type: string }
      required: [reset, message]

    AccountApplication:
      type: object
      properties:
        id: { type: string }
        applicant_name: { type: string }
        applicant_email: { type: string, format: email }
        applicant_phone: { type: [string, "null"] }
        company_name: { type: string }
        company_domain: { type: [string, "null"] }
        requested_plan: { type: string }
        document_reference: { type: [string, "null"] }
        document_type: { type: [string, "null"] }
        verification_status: { type: string }
        verification_notes: { type: [string, "null"] }
        rejection_reason: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        reviewed_at: { type: [string, "null"], format: date-time }
      required:
        - id
        - applicant_name
        - applicant_email
        - applicant_phone
        - company_name
        - company_domain
        - requested_plan
        - document_reference
        - document_type
        - verification_status
        - verification_notes
        - rejection_reason
        - created_at
        - reviewed_at

    AccountApplicationList:
      type: array
      items:
        $ref: "#/components/schemas/AccountApplication"

    AccountApplicationDecisionRequest:
      type: object
      properties:
        decision:
          type: string
          enum: [approved, rejected]
        notes:
          type: string
        rejection_reason:
          type: string
      required: [decision]

    CompanyOnboardingResponse:
      type: object
      properties:
        organization:
          $ref: "#/components/schemas/OnboardedOrganization"
        user:
          $ref: "#/components/schemas/OnboardedUser"
      required:
        - organization
        - user

    OnboardedOrganization:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        domain:
          type: string
        initials:
          type: string
        industry:
          type: string
        company_size:
          type: string
        status:
          type: string
      required:
        - id
        - name
        - domain
        - initials
        - industry
        - company_size
        - status

    OnboardedUser:
      type: object
      properties:
        id:
          type: string
        organization_id:
          type: string
        email:
          type: string
        name:
          type: string
        role:
          type: string
        status:
          type: string
      required:
        - id
        - organization_id
        - email
        - name
        - role
        - status

    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    KnowledgeFileUploadInput:
      type: object
      properties:
        original_file_name:
          type: string
          minLength: 1
        mime_type:
          type: string
          minLength: 1
        size_bytes:
          type: number
          minimum: 1
        employee_key:
          type: ["string", "null"]
      required:
        - original_file_name
        - mime_type
        - size_bytes

    KnowledgeFileFinalizeInput:
      type: object
      properties:
        original_file_name:
          type: string
          minLength: 1
        mime_type:
          type: string
          minLength: 1
        size_bytes:
          type: number
          minimum: 1
        storage_key:
          type: string
          minLength: 1
        employee_key:
          type: ["string", "null"]
      required:
        - original_file_name
        - mime_type
        - size_bytes
        - storage_key

    KnowledgeFileUploadUrlResponse:
      type: object
      properties:
        upload_url:
          type: string
        storage_key:
          type: string
      required:
        - upload_url
        - storage_key

    KnowledgeFile:
      type: object
      properties:
        id:
          type: string
        original_file_name:
          type: string
        file_type:
          type: string
        mime_type:
          type: string
        size_bytes:
          type: number
        storage_key:
          type: string
        uploaded_by_user_id:
          type: ["string", "null"]
        uploader_name:
          type: string
        created_at:
          type: string
        employee_id:
          type: ["string", "null"]
        employee_name:
          type: ["string", "null"]
        status:
          type: string
      required:
        - id
        - original_file_name
        - file_type
        - mime_type
        - size_bytes
        - storage_key
        - uploaded_by_user_id
        - uploader_name
        - created_at
        - employee_id
        - employee_name
        - status

    KnowledgeFileListResponse:
      type: array
      items:
        $ref: "#/components/schemas/KnowledgeFile"

    KnowledgeFileDownloadUrlResponse:
      type: object
      properties:
        download_url:
          type: string
      required:
        - download_url

    PlatformAnalytics:
      type: object
      properties:
        summary:
          $ref: "#/components/schemas/PlatformAnalyticsSummary"
        companies:
          type: array
          items:
            $ref: "#/components/schemas/PlatformCompanyAnalytics"
        recent_activity:
          type: array
          items:
            $ref: "#/components/schemas/PlatformActivityEvent"
      required:
        - summary
        - companies
        - recent_activity

    PlatformAnalyticsSummary:
      type: object
      properties:
        total_companies:
          type: number
        subscribed_companies:
          type: number
        basic_subscriptions:
          type: number
        premium_subscriptions:
          type: number
        monthly_expected_revenue_cents:
          type: number
        active_companies:
          type: number
        active_users:
          type: number
        total_employees:
          type: number
        total_knowledge_files:
          type: number
        total_storage_bytes:
          type: number
        total_ai_conversations:
          type: number
        total_ai_requests:
          type: number
        total_responses:
          type: number
        companies_registered_last_30_days:
          type: number
      required:
        - total_companies
        - subscribed_companies
        - basic_subscriptions
        - premium_subscriptions
        - monthly_expected_revenue_cents
        - active_companies
        - active_users
        - total_employees
        - total_knowledge_files
        - total_storage_bytes
        - total_ai_conversations
        - total_ai_requests
        - total_responses
        - companies_registered_last_30_days

    PlatformCompanyAnalytics:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        registration_date:
          type: string
        subscription_plan:
          type: string
        subscription_status:
          type: string
        monthly_price_cents:
          type: number
        user_count:
          type: number
        employee_count:
